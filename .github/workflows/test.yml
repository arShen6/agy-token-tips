name: Build macOS HUD
on:
  push:
    branches: ['main']
  pull_request:
permissions:
  contents: read
jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify TokenLensHUD.app
        run: |
          bash macos-hud/build.sh --zip dist/TokenLensHUD-macos-arm64.zip
          otool -l macos-hud/dist/TokenLensHUD.app/Contents/MacOS/TokenLensHUD | grep -A 3 LC_BUILD_VERSION
          unzip -tq dist/TokenLensHUD-macos-arm64.zip
