name: Release macOS HUD
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and package TokenLensHUD.app
        run: |
          mkdir -p dist
          bash macos-hud/build.sh --zip dist/TokenLensHUD-macos-arm64.zip
          (cd dist && shasum -a 256 TokenLensHUD-macos-arm64.zip > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TokenLensHUD-macos-arm64.zip dist/SHA256SUMS.txt --verify-tag --title "agy-token-tips $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
