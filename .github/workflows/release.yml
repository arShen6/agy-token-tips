name: Release installers
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, platform: darwin, arch: arm64, binary: node}
          - {runner: windows-2022, platform: win, arch: x64, binary: node.exe}
          - {runner: ubuntu-24.04, platform: linux, arch: x64, binary: node}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: node test/service-smoke.mjs
      - name: Download verified runtime
        run: python scripts/download_runtime.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Build and smoke-test installers
        shell: bash
        run: |
          python scripts/build_release.py --node "$PWD/.release-runtime/${{ matrix.binary }}" --node-license "$PWD/.release-runtime/LICENSE"
          if [[ "${{ matrix.platform }}" == "darwin" ]]; then
            bash macos-hud/build.sh --zip "dist/TokenLensHUD-macos-${{ matrix.arch }}.zip"
            (cd dist && shasum -a 256 "TokenLensHUD-macos-${{ matrix.arch }}.zip" >> SHA256SUMS.txt)
          fi
          python -c "from pathlib import Path; Path('dist/SHA256SUMS.txt').rename('dist/SHA256SUMS-${{ matrix.platform }}.txt')"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: dist/*
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "agy-token-tips $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
